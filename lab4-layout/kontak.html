<html lang="id">

    <meta charset="UTF-8">

    <title>Kontak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">

                        <label for="pesan">Pesan:</label><br>
                        <textarea id="pesan" name="pesan" rows="6"

                    </p>

                    <p>
                        <button type="submit" class="btn btn-default">
                            Kirim Pesan
                        </button>

                </form>
            </section>
